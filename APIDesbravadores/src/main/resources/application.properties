spring.application.name=APIDesbravadores
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
api.security.token.secret=${JWT_SECRET}
jwt.validity=3600
spring.jpa.show-sql=false

# Nomes de tabela exatamente como no script (MySQL em Linux diferencia maiúsculas)
spring.jpa.hibernate.naming.physical-strategy=school.sptech.APIDesbravadores.config.NomeTabelaExatoNamingStrategy

# Uploads (evidências e foto de perfil): pasta local da API; em Docker monte um volume aqui
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
